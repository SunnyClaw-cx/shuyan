name: 缺陷报告
description: 报告枢言语言或工具链的缺陷
title: "[缺陷] "
labels: ["缺陷"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间报告问题。请尽量提供最小复现材料 —— 这能让定位速度快数倍。

        **若问题是「算错了但不报错」（静默失败），请在标题中加 `[静默]` 前缀，这是最高优先级。**

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，未找到相同问题
          required: true
        - label: 我已在最新代码上复现（`git pull` 后重试）
          required: true
        - label: 这不是「结构体 / 枚举语义未实现」等已知限制（见 CHANGELOG 的已知限制）
          required: true

  - type: input
    id: version
    attributes:
      label: 枢言版本
      description: 运行 `sy 版本` 的输出
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: 问题出现的阶段
      options:
        - 词法分析（`sy 词法`）
        - 语法分析（`sy 语法树`）
        - 语义分析（`sy 检查`）
        - 运行期（`sy 运行`）
        - 格式化器（`sy 格式化`）
        - 静态检查（`sy 检查` 的风格提醒）
        - 标准库
        - 安装 / 打包
        - 文档
        - 不确定
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 最小复现源码
      description: |
        请贴出能复现问题的最小 `.sy` 源码。
        越短越好 —— 通常几行就够。若是中文切分问题，请贴出相关的那一行。
      render: text
      placeholder: |
        定义 年龄 = 20
        输出(年龄)
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: 执行的命令
      render: bash
      placeholder: python sy.py 运行 复现.sy
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际输出
      description: 请**完整**粘贴，包含诊断码与下划线
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望输出
      description: 你认为正确的行为是什么
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 环境
      description: Python 版本与操作系统
      placeholder: Python 3.13.12 / Windows 11
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 其他可能有帮助的信息（截图、相关 Issue、你的分析等）
    validations:
      required: false